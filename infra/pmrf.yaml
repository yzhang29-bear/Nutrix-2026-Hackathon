AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PMRF prediction service: API Gateway (HTTP API) -> VPC link -> internal ALB -> ECS Fargate (2 vCPU / 4 GB),
  person data on DynamoDB + S3 (server/store.py), meal photos in S3. Deployed by scripts/deploy.sh.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image (repository:tag) to run
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Must be in a different AZ from SubnetA (the ALB needs two)
  PhotoBucket:
    Type: String
    Default: nutrix-input-images
  DesiredCount:
    Type: Number
    Default: 1
  ClerkJwtIssuer:
    Type: String
    Description: Clerk JWT issuer, for example https://example.clerk.accounts
  ClerkJwtAudience:
    Type: String
    Description: Required aud claim in the Clerk session-token template
  MobileCorsOrigins:
    Type: String
    Default: http://localhost:8081,http://localhost:8082
    Description: Comma-separated browser origins allowed to call the mobile gateway
  MobileDemoPersonIds:
    Type: String
    Default: cgmacros-003,cgmacros-002
    Description: Comma-separated PMRF patient IDs that signed-in demo accounts may access

Resources:
  # ---------- API key (x-api-key, checked by the service until API Gateway auth is set up)
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/api-key
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  # ---------- Network
  VpcLinkSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API Gateway VPC link
      VpcId: !Ref VpcId
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB, reachable only from the VPC link
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref VpcLinkSG
  TaskSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PMRF tasks, reachable only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSG

  # ---------- Person data on DynamoDB (meta + daily signal chunks) and S3 (first-week states); see server/store.py
  PeopleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nutrix-people
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pid, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pid, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: nutrix-person-state
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------- Load balancer (internal)
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSG]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "75"
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-api-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApiKeySecret
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: photos-and-person-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:aws:s3:::${PhotoBucket}/photos/*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                         dynamodb:Query, dynamodb:BatchWriteItem]
                Resource: !GetAtt PeopleTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${StateBucket.Arn}/*
              # Without ListBucket, S3 answers a missing key with 403 instead of 404, and the service turns that into a 500
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${PhotoBucket}
                Condition:
                  StringLike: {s3:prefix: ["photos/*"]}
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "4096"
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: pmrf
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: PMRF_DATA_DIR, Value: /tmp/pmrf}          # unused: person data is on DynamoDB + S3
            - {Name: PMRF_PHOTO_BUCKET, Value: !Ref PhotoBucket}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: PMRF_THREADS, Value: "2"}
            - {Name: PMRF_MAX_CONCURRENT, Value: "2"}
            - {Name: PMRF_TABLE, Value: !Ref PeopleTable}
            - {Name: PMRF_STATE_BUCKET, Value: !Ref StateBucket}
            - {Name: CLERK_JWT_ISSUER, Value: !Ref ClerkJwtIssuer}
            - {Name: CLERK_JWT_AUDIENCE, Value: !Ref ClerkJwtAudience}
            - {Name: MOBILE_CORS_ORIGINS, Value: !Ref MobileCorsOrigins}
            - {Name: MOBILE_DEMO_PERSON_IDS, Value: !Ref MobileDemoPersonIds}
          Secrets:
            - {Name: PMRF_API_KEY, ValueFrom: !Ref ApiKeySecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: pmrf
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED        # default VPC has no NAT; needed to pull from ECR
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSG]
      LoadBalancers:
        - ContainerName: pmrf
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ---------- API Gateway (HTTP API) -> VPC link -> ALB
  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub ${AWS::StackName}-link
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref VpcLinkSG]
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AWS::StackName
      ProtocolType: HTTP
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Ref Listener
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLink
      PayloadFormatVersion: "1.0"
      TimeoutInMillis: 30000
  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${Integration}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

Outputs:
  ApiUrl:
    Value: !GetAtt Api.ApiEndpoint
  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref LogGroup
  PeopleTable:
    Value: !Ref PeopleTable
  StateBucket:
    Value: !Ref StateBucket
